name: Golden gate

# Started by hand only, never on push or pull request. Every run calls a real
# model and searches the live web, so every run costs money.
on:
  workflow_dispatch:
    inputs:
      think_model:
        description: "Think model to test. Empty uses the THINK_MODEL repository variable."
        required: false
        default: ""
      look_up_model:
        description: "Look-up model to test. Empty uses the LOOK_UP_MODEL repository variable."
        required: false
        default: ""

concurrency:
  group: golden-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Golden set against baseline.json
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.11.15"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run the golden set with the gate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          BASE_URL: ${{ vars.BASE_URL }}
          THINK_MODEL: ${{ inputs.think_model || vars.THINK_MODEL }}
          LOOK_UP_MODEL: ${{ inputs.look_up_model || vars.LOOK_UP_MODEL }}
          ANSWER_STYLE: report
        # The judge comes from the baseline, so both runs are graded alike.
        run: >
          uv run python -m evals.research_agent.run
          --benchmark golden
          --gate
          --grader-model "$(jq -r .judge_model evals/research_agent/baseline.json)"
          --max-concurrency 2
          --budget-usd 2
          --out results/golden/gate.jsonl

      - name: Keep the result lines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-gate-results
          path: backend/results/golden/
          if-no-files-found: ignore
